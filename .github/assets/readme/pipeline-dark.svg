<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="226" viewBox="0 0 1200 226" role="img" aria-label="lab-virtual pipeline">
<style>.f{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="226" rx="16" fill="#0a0a0b"/><rect x=".5" y=".5" width="1199" height="225" rx="16" fill="none" stroke="#26262a"/>
<text x="30" y="44" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="2.5" fill="#d4885a">PROTOTYPE</text><rect x="30" y="70" width="340" height="58" rx="10" fill="#141416" stroke="#3a3a40"/><text x="48" y="95" font-family="'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Aeropendulum</text><text x="48" y="115" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#78716c">arm, DC motor and propeller</text><circle cx="348" cy="99.0" r="5" fill="#2dd4bf"/><line x1="60" y1="128" x2="60" y2="142" stroke="#3a3a40"/><rect x="30" y="142" width="340" height="58" rx="10" fill="#141416" stroke="#3a3a40"/><text x="48" y="167" font-family="'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Sensing and drive</text><text x="48" y="187" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#78716c">potentiometer, H-bridge, PWM</text><circle cx="348" cy="171.0" r="5" fill="#2dd4bf"/><path class="f" d="M376 99.0 H427" stroke="#d4885a" stroke-width="2" fill="none"/><path d="M421 93.0 L429 99.0 L421 105.0" stroke="#d4885a" stroke-width="2" fill="none"/><text x="435" y="44" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="2.5" fill="#d4885a">FIRMWARE (ESP32)</text><rect x="435" y="70" width="340" height="58" rx="10" fill="#141416" stroke="#3a3a40"/><text x="453" y="95" font-family="'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Control loop</text><text x="453" y="115" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#78716c">reference, PID, runs on the board</text><circle cx="753" cy="99.0" r="5" fill="#2dd4bf"/><line x1="465" y1="128" x2="465" y2="142" stroke="#3a3a40"/><rect x="435" y="142" width="340" height="58" rx="10" fill="#141416" stroke="#3a3a40"/><text x="453" y="167" font-family="'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Serial link</text><text x="453" y="187" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#78716c">streams every sample to the PC</text><circle cx="753" cy="171.0" r="5" fill="#2dd4bf"/><path class="f" d="M781 99.0 H832" stroke="#d4885a" stroke-width="2" fill="none"/><path d="M826 93.0 L834 99.0 L826 105.0" stroke="#d4885a" stroke-width="2" fill="none"/><text x="840" y="44" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="2.5" fill="#d4885a">COMPUTER</text><rect x="840" y="70" width="340" height="58" rx="10" fill="#141416" stroke="#3a3a40"/><text x="858" y="95" font-family="'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Desktop GUI</text><text x="858" y="115" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#78716c">configure tests, live plots, CSV</text><circle cx="1158" cy="99.0" r="5" fill="#2dd4bf"/><line x1="870" y1="128" x2="870" y2="142" stroke="#3a3a40"/><rect x="840" y="142" width="340" height="58" rx="10" fill="#141416" stroke="#3a3a40"/><text x="858" y="167" font-family="'Plus Jakarta Sans','Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#f5f5f4">Digital twin</text><text x="858" y="187" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#78716c">3D replica that follows the plant</text><circle cx="1158" cy="171.0" r="5" fill="#2dd4bf"/>
</svg>